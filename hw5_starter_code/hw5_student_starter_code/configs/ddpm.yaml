run_name: ddpm_cosine_cfg
seed: 42
data_dir: ./data/imagenet100_128x128/train
image_size: 128
batch_size: 16
num_workers: 0
num_classes: 100
num_epochs: 600
learning_rate: 0.0001
weight_decay: 0.0
num_train_timesteps: 1000
num_inference_steps: 200
beta_start: 0.0001
beta_end: 0.02
beta_schedule: cosine

variance_type: fixed_small
prediction_type: epsilon
clip_sample: true
clip_sample_range: 1.0
unet_in_size: 64
unet_in_ch: 3
unet_ch: 128
unet_num_res_blocks: 2
unet_ch_mult: [1, 2, 2, 4]
unet_attn: [2, 3]
unet_dropout: 0.0
latent_ddpm: true
use_cfg: true
use_ddim: false
cfg_guidance_scale: 7.5
